[package]
name = "bms-table"
version = "0.13.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
description = "BMS (Be-Music Source) difficulty table parser"
authors = ["MiyakoMeow"]
repository = "https://codeberg.org/brightmeows/bms-table-rs"
documentation = "https://docs.rs/bms-table"
categories = ["data-structures", "games"]
keywords = ["bms", "table", "data", "fetch", "parser"]

[dependencies]
# htmlparser v0.2.1 (2019) is used for zero-copy HTML <meta> extraction.
# It is minimal and unmaintained — adequate for current needs but
# should be replaced if broader HTML parsing or security fixes are required.
htmlparser = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
thiserror = "2"
url = { version = "2", features = ["serde"] }

[dev-dependencies]
anyhow = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
reqwest = { version = "0.13", features = ["cookies"] }

[lints.rust]
dead_code = "deny"
unused = { level = "deny", priority = -1 }
missing_docs = "deny"

[lints.rustdoc]
broken_intra_doc_links = "deny"

[lints.clippy]
# === Restriction (cherry-pick: prevent risky API usage) ===
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
missing_docs_in_private_items = "deny"
mod_module_files = "deny"
panic_in_result_fn = "warn"
dbg_macro = "warn"
todo = "warn"
pub_use = "allow"

# === Pedantic (strict, occasional false positives) ===
pedantic = { level = "deny", priority = -1 }

# === Cargo (manifest hygiene) ===
cargo = { level = "warn", priority = -1 }

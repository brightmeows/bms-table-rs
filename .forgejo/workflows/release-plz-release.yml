name: Release-plz Release

on:
  workflow_dispatch:

jobs:
  release-plz-release:
    name: Publish crates and create release
    runs-on: codeberg-medium
    container:
      image: ghcr.io/catthehacker/ubuntu:rust-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        env:
          GIT_DEFAULT_HASH: sha256
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Restore cargo registry
        uses: https://data.forgejo.org/actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: rust-release-reg-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            rust-release-reg-${{ runner.os }}-

      - name: Restore cargo target
        uses: https://data.forgejo.org/actions/cache@v4
        with:
          path: target
          key: rust-release-target-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            rust-release-target-${{ runner.os }}-

      - name: Install release-plz and publish crates
        run: |
          echo "::group::Install release-plz and cargo-semver-checks"
          cargo binstall --no-confirm \
            release-plz@0.3.159 \
            cargo-semver-checks@0.48
          echo "::endgroup::"

          echo "::group::Configure git"
          git config --global user.name "BrightMeowS"
          git config --global user.email "brightmeows@163.com"
          echo "::endgroup::"

          echo "::group::Run release-plz release"
          release-plz release \
            --forge gitea \
            --git-token "${{ secrets.GITHUB_TOKEN }}"
          echo "::endgroup::"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

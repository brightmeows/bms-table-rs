name: Release-plz PR

on:
  push:
    branches: [main]

jobs:
  release-plz-pr:
    name: Prepare release PR
    runs-on: codeberg-small
    container:
      image: ghcr.io/catthehacker/ubuntu:rust-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        env:
          GIT_DEFAULT_HASH: sha256
        with:
          # Full history is required by release-plz to determine version bumps
          # based on conventional commits.
          fetch-depth: 0
          # Persist credentials so git push (called by release-plz) can authenticate.
          persist-credentials: true

      - name: Get Rust version
        run: echo "RUST_VERSION=$(rustc --version | cut -d' ' -f2)" >> $GITHUB_ENV

      - name: Restore cargo registry
        uses: https://data.forgejo.org/actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: rust-pr-reg-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            rust-pr-reg-${{ runner.os }}-

      - name: Restore cargo target
        uses: https://data.forgejo.org/actions/cache@v4
        with:
          path: target
          key: rust-pr-target-${{ runner.os }}-${{ env.RUST_VERSION }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            rust-pr-target-${{ runner.os }}-${{ env.RUST_VERSION }}-

      - name: Install release-plz and prepare release PR
        run: |
          echo "::group::Install release-plz and cargo-semver-checks"
          cargo binstall --no-confirm \
            release-plz@0.3.159 \
            cargo-semver-checks@0.48
          echo "::endgroup::"

          echo "::group::Configure git"
          git config --global user.name "BrightMeowS"
          git config --global user.email "brightmeows@163.com"
          echo "::endgroup::"

          echo "::group::Run release-plz release-pr"
          release-plz release-pr \
            --forge gitea \
            --git-token "${{ secrets.GITHUB_TOKEN }}"
          echo "::endgroup::"

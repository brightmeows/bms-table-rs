name: Mirror to Codeberg
on:
  workflow_dispatch:
  push:
    branches: "main"
  schedule:
    # 每周兜底重推，收敛单链路失败的漂移窗口
    - cron: "50 4 * * 1"

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up deploy key
        env:
          DEPLOY_KEY: ${{ secrets.CODEBERG_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan codeberg.org >> ~/.ssh/known_hosts

      - name: Push main and tags to Codeberg
        run: |
          git remote add codeberg git@codeberg.org:brightmeows/bms-table-rs.git
          git push codeberg main
          git push codeberg --tags
